</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"tp","options":["tp","sponge","bodywash","toothpaste","soap","filter"]},"size":{"editor":"int","default":150,"min":40,"max":300},"$preview":{"width":150,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'tp';
    return { is: { [k === 'brita' ? 'filter' : k]: true }, size: this.props.size ?? 150, label: k + ' product image' };
  }
}
</script>
</body>
</html>
